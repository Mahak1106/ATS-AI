<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ATS.AI | Smart Recruitment Platform</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

*{
    font-family:'Poppins',sans-serif;
}

body{
    margin:0;
    background:linear-gradient(135deg,#4f46e5,#7c3aed,#9333ea);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow-x:hidden;
}

.hero-card{
    width:95%;
    max-width:1100px;
    background:rgba(255,255,255,.12);
    backdrop-filter:blur(18px);
    border-radius:25px;
    padding:60px;
    color:white;
    box-shadow:0 20px 45px rgba(0,0,0,.25);
}

.logo{
    width:90px;
    height:90px;
    margin:auto;
    border-radius:50%;
    background:white;
    color:#6d28d9;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:42px;
    margin-bottom:20px;
}

.hero-title{
    font-size:48px;
    font-weight:700;
}

.hero-text{
    color:#e5e5e5;
    font-size:18px;
    margin-bottom:35px;
}

.btn-custom{
    padding:14px 32px;
    border-radius:12px;
    font-weight:600;
    transition:.3s;
}

.btn-login{
    background:white;
    color:#6d28d9;
}

.btn-register{
    background:#10b981;
    color:white;
}

.btn-custom:hover{
    transform:translateY(-3px);
}

.feature-card{
    background:rgba(255,255,255,.12);
    border-radius:18px;
    padding:25px;
    margin-top:30px;
    transition:.3s;
    height:100%;
}

.feature-card:hover{
    transform:translateY(-6px);
    background:rgba(255,255,255,.18);
}

.feature-card i{
    font-size:40px;
    margin-bottom:15px;
}

</style>

</head>

<body>

<div class="hero-card">

    <div class="text-center">

        <div class="logo">
            <i class="fas fa-robot"></i>
        </div>

        <h1 class="hero-title">
            ATS.AI
        </h1>

        <p class="hero-text">
            AI-Powered Applicant Tracking System for Modern Recruitment
        </p>

        <a href="/register" class="btn btn-success btn-custom btn-register me-3">
            <i class="fas fa-user-plus"></i>
            Register
        </a>

        <a href="/login" class="btn btn-light btn-custom btn-login">
            <i class="fas fa-right-to-bracket"></i>
            Login
        </a>

    </div>

    <div class="row mt-5">

        <div class="col-md-4">

            <div class="feature-card text-center">

                <i class="fas fa-briefcase"></i>

                <h4>Job Management</h4>

                <p>
                    Recruiters can post and manage job openings with ease.
                </p>

            </div>

        </div>

        <div class="col-md-4">

            <div class="feature-card text-center">

                <i class="fas fa-file-alt"></i>

                <h4>Resume Screening</h4>

                <p>
                    Upload resumes and let AI analyze candidate profiles.
                </p>

            </div>

        </div>

        <div class="col-md-4">

            <div class="feature-card text-center">

                <i class="fas fa-chart-line"></i>

                <h4>AI Ranking</h4>

                <p>
                    Automatically rank candidates based on resume score.
                </p>

            </div>

        </div>

    </div>

</div>

</body>

</html>
